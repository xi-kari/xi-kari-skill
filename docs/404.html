/* A missing address inside the handbook is answered by the handbook's own not-found page. */
(function () {
  var handbook = '/xi-kari-skill/handbook/';
  if (location.pathname.indexOf(handbook) !== 0 || typeof fetch !== 'function') return;
  var root = document.documentElement;
  root.className = 'is-forwarding';
  fetch(handbook + '404.html').then(function (response) {
    if (!response.ok) throw new Error('unavailable');
    return response.text();
  }).then(function (page) {
    document.open();
    document.write(page);
    document.close();
  }).catch(function () { root.className = ''; });
})();
</script>
