<rect width="800" height="430" fill="#f6f8fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="305" y="90" font-size="18" fill="#33415e" text-anchor="middle" font-weight="400">常态进入 B</text><text x="610" y="90" font-size="18" fill="#33415e" text-anchor="middle" font-weight="400">指定干预后进入 B</text><text x="55" y="163" font-size="27" fill="#1f4fc4" text-anchor="start" font-weight="400">A₁</text><rect x="215" y="120" width="180" height="75" rx="2" fill="#fbfcfe" stroke="#0d1b36" stroke-width="1.5"/><text x="305.0" y="164.5" font-size="20" fill="#0d1b36" text-anchor="middle" font-weight="500">0.2</text><rect x="520" y="120" width="180" height="75" rx="2" fill="#fbfcfe" stroke="#0d1b36" stroke-width="1.5"/><text x="610.0" y="164.5" font-size="20" fill="#0d1b36" text-anchor="middle" font-weight="500">0.8</text><path d="M402 158L514 158" stroke="#1f4fc4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="55" y="278" font-size="27" fill="#1f4fc4" text-anchor="start" font-weight="400">A₂</text><rect x="215" y="235" width="180" height="75" rx="2" fill="#fbfcfe" stroke="#0d1b36" stroke-width="1.5"/><text x="305.0" y="279.5" font-size="20" fill="#0d1b36" text-anchor="middle" font-weight="500">0.2</text><rect x="520" y="235" width="180" height="75" rx="2" fill="#fbfcfe" stroke="#0d1b36" stroke-width="1.5"/><text x="610.0" y="279.5" font-size="20" fill="#0d1b36" text-anchor="middle" font-weight="500">0.1</text><path d="M402 273L514 273" stroke="#1f4fc4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="400" y="364" font-size="21" fill="#1f4fc4" text-anchor="middle" font-weight="400">若 A₁ 的份额为 p：混合响应为 0.1 ＋ 0.7p</text><text x="34" y="39" font-size="22" fill="#0d1b36" text-anchor="start" font-weight="600">常态相同，指定干预后的响应可以不同</text><text x="34" y="405" font-size="16" fill="#33415e" text-anchor="start" font-weight="400">所有数值均来自 §4.6 教学设定，不是现实系统测量。</text></g></svg>