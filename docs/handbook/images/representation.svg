<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">同一个总量，可以对应不同的内部构成</title><desc id="desc">结构示意，未设定现实数据。表示是否足够，取决于所问任务。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#445b9f" stroke-width="1.3"/></marker></defs>
<rect width="800" height="400" fill="#f1f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="55" y="95" width="240" height="100" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="175.0" y="145.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">局部状态 A</text><text x="175.0" y="172.0" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">各位置的负荷与容量</text><rect x="55" y="225" width="240" height="100" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="175.0" y="275.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">局部状态 B</text><text x="175.0" y="302.0" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">另一种分配与局部差异</text><rect x="478" y="150" width="245" height="110" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="600.5" y="205.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">同一个汇总值</text><text x="600.5" y="232.0" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">总量 / 平均值</text><path d="M298 143L472 189" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M298 272L472 222" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="510" y="302" font-size="17" fill="#445b9f" text-anchor="start" font-weight="400">要回答局部问题，</text><text x="510" y="329" font-size="17" fill="#445b9f" text-anchor="start" font-weight="400">需保留相应区别。</text><text x="34" y="39" font-size="22" fill="#23364c" text-anchor="start" font-weight="600">同一个总量，可以对应不同的内部构成</text><text x="34" y="375" font-size="16" fill="#51647b" text-anchor="start" font-weight="400">结构示意，未设定现实数据。表示是否足够，取决于所问任务。</text></g></svg>