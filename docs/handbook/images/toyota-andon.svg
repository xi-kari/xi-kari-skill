<svg xmlns="http://www.w3.org/2000/svg" width="800" height="465" viewBox="0 0 800 465" role="img" aria-labelledby="title desc">
<title id="title">安灯：把异常接入响应流程</title><desc id="desc">依据丰田官方流程说明；不是各厂实际执行率与净效果的测量。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#445b9f" stroke-width="1.3"/></marker></defs>
<rect width="800" height="465" fill="#f1f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="35" y="85" width="270" height="95" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="170.0" y="132.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">设备检测到异常并停止</text><text x="170.0" y="159.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">安灯通知工作人员</text><rect x="35" y="230" width="270" height="95" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="170.0" y="277.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">工作人员发现异常</text><text x="170.0" y="304.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">按呼叫按钮或拉绳</text><rect x="455" y="100" width="300" height="90" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="605.0" y="145.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">显示异常与呼叫</text><text x="605.0" y="172.0" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">负责人获得具体位置</text><rect x="455" y="255" width="300" height="90" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="605.0" y="300.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">处理问题与恢复工作</text><text x="605.0" y="327.0" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">按实际流程满足恢复条件</text><path d="M313 130L448 143" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M313 275L448 165" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M605 197L605 247" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="400" y="395" font-size="19" fill="#445b9f" text-anchor="middle" font-weight="400">灯光、停止、处理与长期学习，需要分别判断。</text><text x="34" y="39" font-size="22" fill="#23364c" text-anchor="start" font-weight="600">安灯：把异常接入响应流程</text><text x="34" y="440" font-size="16" fill="#51647b" text-anchor="start" font-weight="400">依据丰田官方流程说明；不是各厂实际执行率与净效果的测量。</text></g></svg>