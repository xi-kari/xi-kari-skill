<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">保留真实恢复，也保留它的成立条件</title><desc id="desc">后两项需要另外取证；支持下的真实恢复不会因此被抹去。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#445b9f" stroke-width="1.3"/></marker></defs>
<rect width="800" height="400" fill="#f1f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="40" y="100" width="220" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="150.0" y="152.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">支持条件仍在</text><text x="150.0" y="179.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">如临时供电</text><rect x="338" y="100" width="420" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="548.0" y="152.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">某项功能在声明窗口内恢复</text><text x="548.0" y="179.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">报告实际覆盖的人群与任务</text><path d="M265 151L332 151" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="400" y="263" font-size="21" fill="#445b9f" text-anchor="middle" font-weight="400">撤除支持后仍可用？</text><text x="400" y="306" font-size="21" fill="#445b9f" text-anchor="middle" font-weight="400">全部人群与长期生活结果也恢复？</text><text x="34" y="39" font-size="22" fill="#23364c" text-anchor="start" font-weight="600">保留真实恢复，也保留它的成立条件</text><text x="34" y="375" font-size="16" fill="#51647b" text-anchor="start" font-weight="400">后两项需要另外取证；支持下的真实恢复不会因此被抹去。</text></g></svg>