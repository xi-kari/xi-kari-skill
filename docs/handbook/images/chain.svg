<svg xmlns="http://www.w3.org/2000/svg" width="800" height="445" viewBox="0 0 800 445" role="img" aria-labelledby="title desc">
<title id="title">两段平均有效，不保证由同一组对象承接</title><desc id="desc">原文 §2.4.2 的形式反例：两类人各占一半，并非现实测量。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#445b9f" stroke-width="1.3"/></marker></defs>
<rect width="800" height="445" fill="#f1f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="260" y="88" font-size="18" fill="#51647b" text-anchor="middle" font-weight="400">处理 → 中介</text><text x="590" y="88" font-size="18" fill="#51647b" text-anchor="middle" font-weight="400">中介 → 结果</text><text x="35" y="156" font-size="19" fill="#23364c" text-anchor="start" font-weight="400">第一类人</text><rect x="170" y="115" width="205" height="70" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="272.5" y="157.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">会响应</text><rect x="485" y="115" width="250" height="70" rx="5" fill="#e7edf8" stroke="#c9d6e6"/><text x="610.0" y="157.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">不响应</text><path d="M380 150L480 150" stroke="#445b9f" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="35" y="254" font-size="19" fill="#23364c" text-anchor="start" font-weight="400">第二类人</text><rect x="170" y="215" width="205" height="70" rx="5" fill="#e7edf8" stroke="#c9d6e6"/><text x="272.5" y="257.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">不响应</text><rect x="485" y="215" width="250" height="70" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="610.0" y="257.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">会响应</text><path d="M380 250L480 250" stroke="#445b9f" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="400" y="345" font-size="22" fill="#445b9f" text-anchor="middle" font-weight="400">两段平均作用各为 1/2，整链作用仍可为 0。</text><text x="34" y="39" font-size="22" fill="#23364c" text-anchor="start" font-weight="600">两段平均有效，不保证由同一组对象承接</text><text x="34" y="420" font-size="16" fill="#51647b" text-anchor="start" font-weight="400">原文 §2.4.2 的形式反例：两类人各占一半，并非现实测量。</text></g></svg>