<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" aria-labelledby="title desc">
  <title id="title">Xikari Skill — 让理解走向判断</title>
  <desc id="desc">蓝白色视觉图：材料、机制与代价三条线索汇入判断，再展开为可比较、可调整的行动方案。</desc>
  <defs>
    <linearGradient id="mwash" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="0.6" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#e3ebf7"/>
    </linearGradient>
    <linearGradient id="mrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#445b9f"/>
      <stop offset="0.72" stop-color="#7b93cf"/>
      <stop offset="1" stop-color="#c3d0e8"/>
    </linearGradient>
    <linearGradient id="mbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#445b9f" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#445b9f" stop-opacity="1"/>
      <stop offset="1" stop-color="#445b9f" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="mhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#445b9f" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#445b9f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mgrain" width="110" height="110" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1" fill="#445b9f" fill-opacity="0.07"/>
      <circle cx="48" cy="36" r="1.2" fill="#445b9f" fill-opacity="0.05"/>
      <circle cx="82" cy="76" r="1" fill="#445b9f" fill-opacity="0.06"/>
      <circle cx="24" cy="94" r="1.1" fill="#445b9f" fill-opacity="0.05"/>
      <circle cx="96" cy="24" r=".9" fill="#445b9f" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="680" height="640" fill="url(#mwash)"/>
  <rect width="680" height="640" fill="url(#mgrain)"/>
  <rect width="680" height="7" fill="url(#mrule)"/>
  <ellipse cx="340" cy="452" rx="290" ry="150" fill="url(#mhalo)"/>

  <g fill="#1f3049">
    <text x="42" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="80" letter-spacing="-3">Xikari</text>
    <text x="42" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="8" fill="#445b9f">SKILL</text>
    <path d="M44 194h300" stroke="#c9d6e9" stroke-width="1.4"/>
    <text x="42" y="252" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="40">让理解走向判断。</text>
  </g>
  <text x="44" y="296" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#52647f">深入解释 · 明确决断 · 持续创造</text>
  <rect x="44" y="318" width="13" height="3" fill="#445b9f"/>
  <text x="66" y="324" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#6b7c95">离线阅读页 · 条件模型 · 案例积累</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 420C196 420 178 500 300 500" stroke="#9dafca" stroke-width="1.6"/>
    <path d="M96 580C196 580 178 500 300 500" stroke="#9dafca" stroke-width="1.6"/>
    <path d="M300 500C382 500 392 420 540 420" stroke="#b7c5da" stroke-width="1.6" stroke-dasharray="4 9"/>
    <path d="M300 500C382 500 392 580 540 580" stroke="#b7c5da" stroke-width="1.6" stroke-dasharray="4 9"/>
    <path d="M96 500H300C400 500 424 500 560 500" stroke="url(#mbeam)" stroke-width="4.5"/>
    <path d="M542 486L560 500L542 514" stroke="#445b9f" stroke-width="4"/>
    <path d="M540 420h108M540 580h108" stroke="#c9d6e9" stroke-width="1.6"/>
    <circle cx="96" cy="420" r="7.5" fill="#f7fafd" stroke="#8ea3c2" stroke-width="1.8"/>
    <circle cx="96" cy="500" r="9" fill="#445b9f" stroke="#445b9f" stroke-width="1.8"/>
    <circle cx="96" cy="580" r="7.5" fill="#f7fafd" stroke="#8ea3c2" stroke-width="1.8"/>
    <circle cx="300" cy="500" r="40" fill="#f7fafd" stroke="#445b9f" stroke-width="1.8"/>
    <circle cx="300" cy="500" r="30" fill="#eef4fb" stroke="#9db1d0" stroke-width="1.2"/>
    <circle cx="540" cy="420" r="5" fill="#f7fafd" stroke="#b7c5da" stroke-width="1.6"/>
    <circle cx="540" cy="580" r="5" fill="#f7fafd" stroke="#b7c5da" stroke-width="1.6"/>
  </g>

  <g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="21" fill="#52647f">
    <text x="44" y="428">材料</text>
    <text x="44" y="508">机制</text>
    <text x="44" y="588">代价</text>
    <text x="300" y="508" text-anchor="middle" fill="#445b9f" font-size="25">判断</text>
    <text x="640" y="468" text-anchor="end" fill="#445b9f">比较路径</text>
    <text x="640" y="628" text-anchor="end" fill="#445b9f">形成方案</text>
  </g>
</svg>
