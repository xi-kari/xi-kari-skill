    <path d="M879 186L892 198L879 210" stroke="#445b9f" stroke-width="4"/>
    <path d="M610 350H944" stroke="#d2ddea"/>
    <circle cx="562" cy="95" r="8" fill="#f3f7fc" stroke="#8196b7" stroke-width="2"/>
    <circle cx="562" cy="198" r="8" fill="#445b9f" stroke="#445b9f" stroke-width="2"/>
    <circle cx="562" cy="301" r="8" fill="#f3f7fc" stroke="#8196b7" stroke-width="2"/>
    <circle cx="698" cy="198" r="34" fill="#f3f7fc" stroke="#445b9f" stroke-width="2"/>
    <circle cx="873" cy="95" r="6" fill="#f3f7fc" stroke="#b8c6da" stroke-width="2"/>
