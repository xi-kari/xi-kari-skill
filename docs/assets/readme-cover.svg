<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Xikari Skill — 让理解走向判断</title>
  <desc id="desc">蓝白色视觉图：材料、机制与代价汇入判断，比较不同路径，形成行动方案。</desc>
  <rect width="1000" height="410" fill="#f3f7fc"/>
  <path d="M0 0H1000" stroke="#445b9f" stroke-width="8"/>
  <g fill="#1f3049">
    <text x="54" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="-3">Xikari</text>
    <text x="58" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="8" fill="#445b9f">SKILL</text>
    <text x="54" y="250" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="37">让理解走向判断。</text>
    <text x="56" y="298" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#52647f">深入解释 · 明确决断 · 持续创造</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
