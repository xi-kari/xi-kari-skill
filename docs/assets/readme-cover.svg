    <text x="587" y="331">代价</text>
    <text x="698" y="205" text-anchor="middle" fill="#445b9f" font-size="21">判断</text>
    <text x="914" y="205" fill="#445b9f">行动</text>
    <text x="944" y="378" text-anchor="end" font-size="17">条件改变，选择也可以改变。</text>
