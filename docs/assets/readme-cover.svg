<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Xikari Skill — 让理解走向判断</title>
  <desc id="desc">蓝白色视觉图：材料、机制与代价三条线索汇入判断，再展开为可比较、可调整的行动方案。</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="0.55" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#e4ecf8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#445b9f" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#445b9f" stop-opacity="1"/>
      <stop offset="1" stop-color="#445b9f" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#445b9f"/>
      <stop offset="0.72" stop-color="#7b93cf"/>
      <stop offset="1" stop-color="#c3d0e8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#445b9f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#445b9f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="9" r="1" fill="#445b9f" fill-opacity="0.07"/>
      <circle cx="52" cy="31" r="1.2" fill="#445b9f" fill-opacity="0.05"/>
      <circle cx="88" cy="72" r="1" fill="#445b9f" fill-opacity="0.06"/>
      <circle cx="27" cy="95" r="1.1" fill="#445b9f" fill-opacity="0.05"/>
      <circle cx="104" cy="18" r=".9" fill="#445b9f" fill-opacity="0.05"/>
      <circle cx="68" cy="110" r="1" fill="#445b9f" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="url(#wash)"/>
  <rect width="1200" height="460" fill="url(#grain)"/>
  <rect width="1200" height="7" fill="url(#rule)"/>
  <ellipse cx="846" cy="230" rx="300" ry="205" fill="url(#halo)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M690 108C764 108 748 230 838 230" stroke="#9dafca" stroke-width="1.6"/>
    <path d="M690 352C764 352 748 230 838 230" stroke="#9dafca" stroke-width="1.6"/>
    <path d="M838 230C906 230 916 118 1010 118" stroke="#b7c5da" stroke-width="1.6" stroke-dasharray="4 9"/>
    <path d="M838 230C906 230 916 342 1010 342" stroke="#b7c5da" stroke-width="1.6" stroke-dasharray="4 9"/>
    <path d="M690 230H838C918 230 926 230 1024 230" stroke="url(#beam)" stroke-width="4.5"/>
    <path d="M1006 216L1024 230L1006 244" stroke="#445b9f" stroke-width="4"/>
    <path d="M1010 118h124" stroke="#c9d6e9" stroke-width="1.6"/>
    <path d="M1010 342h124" stroke="#c9d6e9" stroke-width="1.6"/>
    <circle cx="690" cy="108" r="7.5" fill="#f7fafd" stroke="#8ea3c2" stroke-width="1.8"/>
    <circle cx="690" cy="230" r="9" fill="#445b9f" stroke="#445b9f" stroke-width="1.8"/>
    <circle cx="690" cy="352" r="7.5" fill="#f7fafd" stroke="#8ea3c2" stroke-width="1.8"/>
    <circle cx="838" cy="230" r="40" fill="#f7fafd" stroke="#445b9f" stroke-width="1.8"/>
    <circle cx="838" cy="230" r="30" fill="#eef4fb" stroke="#9db1d0" stroke-width="1.2"/>
    <circle cx="1010" cy="118" r="5" fill="#f7fafd" stroke="#b7c5da" stroke-width="1.6"/>
    <circle cx="1010" cy="342" r="5" fill="#f7fafd" stroke="#b7c5da" stroke-width="1.6"/>
  </g>

  <g fill="#1f3049">
    <text x="62" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="-3.5">Xikari</text>
    <text x="66" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="9" fill="#445b9f">SKILL</text>
    <path d="M66 208h292" stroke="#c9d6e9" stroke-width="1.4"/>
    <text x="62" y="272" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="38" letter-spacing="1">让理解走向判断。</text>
  </g>
  <text x="64" y="312" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="19" fill="#52647f" letter-spacing="1">深入解释 · 明确决断 · 持续创造</text>
  <rect x="64" y="336" width="14" height="3" fill="#445b9f"/>
  <text x="88" y="342" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#6b7c95">离线阅读页 · 条件模型 · 案例积累</text>

  <g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#52647f">
    <text x="718" y="96">材料</text>
    <text x="718" y="216">机制</text>
    <text x="718" y="376">代价</text>
    <text x="838" y="238" text-anchor="middle" fill="#445b9f" font-size="21">判断</text>
    <text x="1146" y="124" text-anchor="end" fill="#445b9f">比较路径</text>
    <text x="1146" y="348" text-anchor="end" fill="#445b9f">形成方案</text>
    <text x="1146" y="432" text-anchor="end" font-size="16" fill="#6b7c95">条件改变，选择也可以改变。</text>
  </g>
</svg>
