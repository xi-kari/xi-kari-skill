interface:
  display_name: "Xikari Skill"
  short_description: "按问题组合解释、推演、条件前瞻与选择，给出明确判断和完整成果"
  default_prompt: "使用 $xi-kari-skill，以Xikari著《Xikari-条件结构与转化论》为理论来源，按七条路由选择所需模块；默认完整学习，仅在明确授权实验时分层阅读。条件前瞻先登记目标、期限、基线和失败条件，方案另作规范与权限判断。按需取材与计算，充分展开机制、反方和条件，用完整论证、案例与适合的图表交付，并支持同问题持续深化。"
policy:
  allow_implicit_invocation: false
