version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/tests/dom"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      dom-test-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      handbook-toolchain-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
