name: 运行问题
description: 报告安装、分析、持续对话、辅助工具或网页的问题
labels: ["bug"]
body:
  - type: input
    id: host
    attributes:
      label: 使用环境
      description: 填写宿主与操作系统；分析问题可补充模型，网页问题可补充浏览器。无需提供账号或本机完整路径。
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - 安装与发现技能
        - 分析与持续对话
        - 多智能体协作
        - 材料、条件推演、稿件或案例工具
        - 阅读器或项目介绍页
        - 其他 / 不确定
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望行为、实际行为与复现步骤
    validations:
      required: true
  - type: textarea
    id: error-output
    attributes:
      label: 精确报错或输出
      description: 粘贴相关报错与退出码；请先移除敏感材料、凭据和个人路径
      render: text
  - type: input
    id: version
    attributes:
      label: 技能版本或下载来源
      description: Release 版本、安装包文件名或下载日期；开发版本可填写 git rev-parse --short HEAD 的结果。
  - type: textarea
    id: example
    attributes:
      label: 最小复现材料（可选）
      description: 提供可公开的简短输入、操作步骤或截图；无需上传完整私人案例
      render: text
