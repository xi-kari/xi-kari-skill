<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>README figure: generated pages</title>
<!--
  Frame for .github/readme/outputs-*.png and docs/assets/outputs-*.png. capture.cjs builds the
  three pages with the packaged tools, photographs them, puts the pictures into the [data-shot]
  images and photographs #figure. Open with ?theme=night for the night printing. The frame is
  drawn the way the pages themselves are (DESIGN.md, "Output surfaces"): square sheets on the desk
  ground, ink rules, and the page's kind as an ink sign at the end of its strip. Its labels are set
  in an installed Noto Sans SC, which capture.cjs checks for.
-->
<style>
  :root {
    --desk: #eef2f9; --edge: #9aabc8; --sheet: #fbfcfe; --ink: #0d1b36; --name: #33415e;
    --sign: #0d1b36; --sign-text: #fbfcfe;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
    --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  }
  :root[data-theme="night"] {
    --desk: #070e1d; --edge: #3d5282; --sheet: #0a1326; --ink: #e9effb; --name: #b9c5dd;
    --sign: #e9effb; --sign-text: #0a1326;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { width: 1920px; -webkit-font-smoothing: antialiased; font-synthesis: none; }
  #figure {
    width: 1920px; height: 870px; padding: 62px;
    display: grid; grid-template-columns: 1151px 610px; grid-template-rows: 356px 356px; gap: 37px;
    background: var(--desk); border: 1px solid var(--edge);
  }
  .panel { display: grid; grid-template-rows: 66px minmax(0, 1fr); overflow: hidden; background: var(--sheet); border: 2px solid var(--ink); }
  .panel--main { grid-row: 1 / span 2; }
  .panel header { display: flex; align-items: stretch; justify-content: space-between; background: var(--sheet); border-bottom: 2px solid var(--ink); }
  .panel code { align-self: center; padding: 0 24px; font-family: var(--mono); font-size: 25px; letter-spacing: .01em; color: var(--name); }
  .panel b { display: grid; place-items: center; padding: 0 26px 2px; font-family: var(--sans); font-size: 24px; font-weight: 900; line-height: 1.3; color: var(--sign-text); background: var(--sign); }
  .panel img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
</style>
</head>
<body>
<figure id="figure">
  <section class="panel panel--main"><header><code>xi-kari-answer.html</code><b>离线阅读页</b></header><img data-shot="reading" alt=""></section>
  <section class="panel"><header><code>condition-results.html</code><b>条件模型页</b></header><img data-shot="condition" alt=""></section>
  <section class="panel"><header><code>comparison-table.html</code><b>方案比较表</b></header><img data-shot="comparison" alt=""></section>
</figure>
<script>
if (new URLSearchParams(location.search).get('theme') === 'night') document.documentElement.dataset.theme = 'night';
</script>
</body>
</html>
