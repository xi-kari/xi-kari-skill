<svg xmlns="http://www.w3.org/2000/svg" width="800" height="455" viewBox="0 0 800 455" role="img" aria-labelledby="title desc">
<title id="title">围绕同一件事，分别核对不同位置</title><desc id="desc">位置可以重合，也可以分开。依据 §2.8、§7.2.4—7.2.5。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#445b9f" stroke-width="1.3"/></marker></defs>
<rect width="800" height="455" fill="#f1f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="280" y="175" width="240" height="90" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="400.0" y="227.0" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">同一项工作</text><rect x="35" y="75" width="235" height="75" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="152.5" y="112.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">承接载体</text><text x="152.5" y="139.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">实际执行与传导</text><rect x="530" y="75" width="235" height="75" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="647.5" y="112.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">责任主体</text><text x="647.5" y="139.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">需要独立责任依据</text><rect x="35" y="305" width="235" height="75" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="152.5" y="342.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">成本承担者</text><text x="152.5" y="369.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">实际付出什么</text><rect x="530" y="305" width="235" height="75" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="647.5" y="342.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">受益者</text><text x="647.5" y="369.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">得到什么结果</text><path d="M278 190L230 150" stroke="#445b9f" stroke-width="2" fill="none"/><path d="M522 190L570 150" stroke="#445b9f" stroke-width="2" fill="none"/><path d="M278 250L230 305" stroke="#445b9f" stroke-width="2" fill="none"/><path d="M522 250L570 305" stroke="#445b9f" stroke-width="2" fill="none"/><text x="400" y="112" font-size="18" fill="#445b9f" text-anchor="middle" font-weight="400">谁有决定权与停止权？</text><text x="34" y="39" font-size="22" fill="#23364c" text-anchor="start" font-weight="600">围绕同一件事，分别核对不同位置</text><text x="34" y="430" font-size="16" fill="#51647b" text-anchor="start" font-weight="400">位置可以重合，也可以分开。依据 §2.8、§7.2.4—7.2.5。</text></g></svg>