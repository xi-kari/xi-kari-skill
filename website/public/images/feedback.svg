<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
<title id="title">一条申诉，可以停在不同的位置</title><desc id="desc">依据 §3.3、§6.4 的虚拟申诉例；虚线表示待核对的连接。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#445b9f" stroke-width="1.3"/></marker></defs>
<rect width="800" height="380" fill="#f1f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="34" y="95" width="210" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="139.0" y="147.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">收件与回执</text><text x="139.0" y="174.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">能确认消息到达</text><rect x="294" y="95" width="210" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="399.0" y="147.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">后续状态改变</text><text x="399.0" y="174.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">仍要核对返回作用</text><rect x="554" y="95" width="210" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="659.0" y="147.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">变化进入执行</text><text x="659.0" y="174.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">追踪实际持续时间</text><path d="M246 147L291 147" stroke="#445b9f" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M506 147L551 147" stroke="#445b9f" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="400" y="258" font-size="23" fill="#445b9f" text-anchor="middle" font-weight="400">到达 ≠ 有效反馈 ≠ 完整写回 ≠ 载体学习</text><text x="400" y="300" font-size="18" fill="#51647b" text-anchor="middle" font-weight="400">每一项判断都需要自己的依据。</text><text x="34" y="39" font-size="22" fill="#23364c" text-anchor="start" font-weight="600">一条申诉，可以停在不同的位置</text><text x="34" y="355" font-size="16" fill="#51647b" text-anchor="start" font-weight="400">依据 §3.3、§6.4 的虚拟申诉例；虚线表示待核对的连接。</text></g></svg>