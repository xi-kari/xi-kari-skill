<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">经验怎样进入下一次任务</title><desc id="desc">当前载体充分，不取消先前经历的形成作用。依据 §4.5、§6.3。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#445b9f" stroke-width="1.3"/></marker></defs>
<rect width="800" height="400" fill="#f1f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="34" y="95" width="210" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="139.0" y="147.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">先前经历 H</text><text x="139.0" y="174.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">形成作用</text><rect x="294" y="95" width="210" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="399.0" y="147.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">当前载体 S</text><text x="399.0" y="174.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">技能、规则、状态</text><rect x="554" y="95" width="210" height="105" rx="5" fill="#ffffff" stroke="#c9d6e6"/><text x="659.0" y="147.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">后续结果 Y</text><text x="659.0" y="174.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">实际调用与任务结果</text><path d="M245 147L291 147" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M505 147L551 147" stroke="#445b9f" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="130" y="253" width="540" height="75" rx="5" fill="#e7edf8" stroke="#c9d6e6"/><text x="400.0" y="290.5" font-size="20" fill="#23364c" text-anchor="middle" font-weight="500">给定 S 之后，H 还增加多少信息？</text><text x="400.0" y="317.5" font-size="15" fill="#51647b" text-anchor="middle" font-weight="400">这是额外历史增量的问题</text><text x="34" y="39" font-size="22" fill="#23364c" text-anchor="start" font-weight="600">经验怎样进入下一次任务</text><text x="34" y="375" font-size="16" fill="#51647b" text-anchor="start" font-weight="400">当前载体充分，不取消先前经历的形成作用。依据 §4.5、§6.3。</text></g></svg>